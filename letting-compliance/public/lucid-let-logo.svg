<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- House roof -->
  <polygon points="100,8 20,62 40,62" fill="#0f2d4f"/>
  <polygon points="100,8 180,62 160,62" fill="#0f2d4f"/>
  <!-- House body -->
  <rect x="40" y="62" width="120" height="55" rx="2" fill="#0f2d4f"/>
  <!-- Door -->
  <rect x="84" y="82" width="32" height="35" rx="2" fill="white" opacity="0.15"/>
  <!-- Inner roof accent -->
  <polygon points="100,28 60,58 140,58" fill="#1a4a7a" opacity="0.6"/>
  <!-- LET text on roof -->
  <text x="88" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="white" letter-spacing="1">LET</text>
  <!-- LUCID text -->
  <text x="24" y="100" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="white" letter-spacing="2">LUCID</text>
</svg>
